model:
  name: segformer
  variant: b2
  pretrained: true
  encoder_weights: outputs/pretrained/nvidia-mit-b2.bin
image_size: [640, 480]  # 寬、高
training:
  epochs: 40
  batch_size: auto
  accumulation: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_epochs: 3
  clip_grad: 1.0
  patience: 15
  mixed_precision: true
loss:
  name: ce_dice
  dice_weight: 0.5
  class_weights: null
